# fly.toml app configuration file generated for aplicacao-web-flask on 2026-10-11T16:02:28Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'aplicacao-web-flask'
primary_region = 'gru'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
